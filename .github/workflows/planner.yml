name: Weekly inventory planner

# Runs every morning and writes the plan into Supabase: the two need tables and
# the dashboard page. Needs a DATABASE_URL secret (Supabase pooler connection string).

on:
  schedule:
    - cron: "0 11 * * *"      # 11:00 UTC = 06:00 in Indianapolis
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy scipy sqlalchemy psycopg2-binary

      - name: Run the planner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python inventory_planner.py

      - name: Keep the run output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-output
          path: planner_output/
          retention-days: 14
